<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindPath Studio 思路啟行 - 首頁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; }
    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      background: url('images/MINDPATH 11.jpg') center/cover no-repeat;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
    }
    .nav {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 2;
      display: flex;
      gap: 20px;
    }
    .nav a {
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 10px 15px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      transition: background 0.3s;
    }
    .nav a:hover {
      background: rgba(255,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="nav">
      <a href="about.html">關於我們</a>
      <a href="services.html">服務項目</a>
      <a href="contact.html">聯絡我們</a>
    </div>
  </div>
</body>
</html>
