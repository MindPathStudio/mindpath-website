<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MindPath Studio 思路啟行：助力香港品牌拓展內地市場的創意工作室">
  <meta name="keywords" content="香港品牌推廣, 小紅書營銷, 社交媒體管理, Facebook 廣告, Instagram, YouTube, Google SEO">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>MindPath Studio 思路啟行</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      color: #222;
      background-color: #fff;
      margin: 0;
    }
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      z-index: 1000;
    }
    header h1 {
      font-size: 1.5rem;
    }
    nav a {
      margin-left: 1rem;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .hero {
      height: 100vh;
      background: url("MINDPATH 11.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }
    .hero h2 {
      font-size: 2.5rem;
      padding: 2rem;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
    }
    .section {
      max-width: 1000px;
      margin: auto;
      padding: 4rem 2rem;
    }
    .service-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .service-buttons a {
      background: #f7f7f7;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
      transition: background 0.3s;
    }
    .service-buttons a:hover {
      background: #ddd;
    }
    footer {
      background: #111;
      color: #ccc;
      text-align: center;
      padding: 2rem 1rem;
    }
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .hero h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>MindPath Studio</h1>
    <nav>
      <a href="about.html">關於我們</a>
      <a href="services.html">服務項目</a>
      <a href="contact.html">聯絡我們</a>
    </nav>
  </header>
  <section class="hero">
    <h2>創意策略 × 在地推廣｜助你走進內地，也讓內地了解香港品牌</h2>
  </section>
  <footer>

  </footer>
</body>
</html>
